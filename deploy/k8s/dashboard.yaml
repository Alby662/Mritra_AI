apiVersion: apps/v1
kind: Deployment
metadata:
  name: mritra-dashboard
  namespace: mritra-aml
  labels:
    app: mritra-dashboard
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mritra-dashboard
  template:
    metadata:
      labels:
        app: mritra-dashboard
        component: frontend
    spec:
      containers:
        - name: dashboard
          image: mritra-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mritra-dashboard-service
  namespace: mritra-aml
  labels:
    app: mritra-dashboard
spec:
  type: ClusterIP
  selector:
    app: mritra-dashboard
  ports:
    - name: http
      port: 80
      targetPort: 80
