name: Dashboard CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Oxlint Static Analysis
        run: npm run lint

      - name: TypeScript Type Check
        run: npx tsc -b

      - name: Production Vite Build
        run: npm run build

      - name: Archive Production Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist
          retention-days: 7

  deploy-to-ec2:
    name: Deploy to EC2 Web Server
    needs: quality-gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: ./dist

      - name: Check Deployment Secrets
        id: deploy-guard
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
          SSH_KEY_RAW: ${{ secrets.EC2_SSH_KEY }}
        run: |
          missing=()
          [ -z "$EC2_HOST" ] && missing+=("EC2_HOST")
          if [ -z "$SSH_KEY_B64" ] && [ -z "$SSH_KEY_RAW" ]; then
            missing+=("EC2_SSH_KEY or EC2_SSH_KEY_B64")
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Skipping EC2 deploy because required secrets are missing: ${missing[*]}"
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"

      - name: Configure SSH Key
        if: steps.deploy-guard.outputs.deploy_enabled == 'true'
        env:
          SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
          SSH_KEY_RAW: ${{ secrets.EC2_SSH_KEY }}
        run: |
          python3 - << 'PYEOF'
          import os, sys, re, base64, subprocess

          b64 = os.environ.get("SSH_KEY_B64", "").strip()
          raw = os.environ.get("SSH_KEY_RAW", "").strip()

          key_data = ""
          if b64:
              print("Decoding EC2_SSH_KEY_B64...")
              try:
                  key_data = base64.b64decode(b64).decode("utf-8")
              except Exception as e:
                  print(f"::warning::Base64 decode failed: {e}")

          if not key_data and raw:
              # Check if raw itself is base64 encoded
              if raw.startswith("LS0t") or ("BEGIN" not in raw and len(raw) > 200):
                  print("Detecting base64 content in raw secret...")
                  try:
                      key_data = base64.b64decode(raw).decode("utf-8")
                  except Exception:
                      pass
              if not key_data:
                  print("Using raw EC2_SSH_KEY secret...")
                  key_data = raw

          if not key_data:
              print("::error::Neither EC2_SSH_KEY_B64 nor EC2_SSH_KEY secret is configured!")
              sys.exit(1)

          # Auto-heal: Fix line breaks if newlines were collapsed into spaces by web UI
          match = re.search(r'(-----BEGIN [A-Z ]+-----)\s*(.*?)\s*(-----END [A-Z ]+-----)', key_data, re.DOTALL)
          if match:
              h, b, f = match.groups()
              b_clean = "".join(b.split())
              chunks = [b_clean[i:i+64] for i in range(0, len(b_clean), 64)]
              key_data = h + "\n" + "\n".join(chunks) + "\n" + f + "\n"

          if not key_data.endswith("\n"):
              key_data += "\n"

          key_path = os.path.expanduser("~/.ssh/id_rsa")
          os.makedirs(os.path.dirname(key_path), exist_ok=True)
          with open(key_path, "w") as f:
              f.write(key_data)
          os.chmod(key_path, 0o600)

          # Validate key syntax
          p = subprocess.run(["ssh-keygen", "-y", "-f", key_path], capture_output=True, text=True)
          if p.returncode != 0:
              print(f"::error::SSH key validation failed: {p.stderr.strip()}")
              sys.exit(1)

          print("SSH key validated successfully!")
          PYEOF

      - name: Register Known Hosts
        if: steps.deploy-guard.outputs.deploy_enabled == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -T 10 "${EC2_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync Build Artifacts via Rsync
        if: steps.deploy-guard.outputs.deploy_enabled == 'true'
        env:
          EC2_USER: ${{ secrets.EC2_USER || 'ec2-user' }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          TARGET_DIR: ${{ secrets.EC2_TARGET_DIR || '/var/www/dashboard' }}
        run: |
          echo "Deploying dashboard to ${EC2_USER}@${EC2_HOST}:${TARGET_DIR}..."
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new" \
            ./dist/ "${EC2_USER}@${EC2_HOST}:${TARGET_DIR}/"

      - name: Reload Nginx Service on EC2
        if: steps.deploy-guard.outputs.deploy_enabled == 'true'
        env:
          EC2_USER: ${{ secrets.EC2_USER || 'ec2-user' }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new "${EC2_USER}@${EC2_HOST}" "sudo systemctl reload nginx || sudo service nginx reload"
          echo "Dashboard successfully deployed and Nginx reloaded!"
