[project]
name = "mritra"
version = "0.1.0"
description = "Privacy-preserving cross-bank money-mule detection on IBM LinuxONE (IBM Z Datathon 2026)"
readme = "Docs/README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2,<3",
    "pyarrow>=15",
    "pyyaml>=6",
    "pydantic>=2",
    "PyNaCl>=1.5",
    "scikit-learn>=1.4",
    "lightgbm>=4",
    "networkx>=3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "cryptography>=42",
    "streamlit>=1.35",
    "plotly>=5",
    "pyvis>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "kaggle>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mritra"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["Docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
