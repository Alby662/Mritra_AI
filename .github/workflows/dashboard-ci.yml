name: Dashboard CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Oxlint Static Analysis
        run: npm run lint

      - name: TypeScript Type Check
        run: npx tsc -b

      - name: Production Vite Build
        run: npm run build

      - name: Archive Production Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist
          retention-days: 7

  deploy-to-ec2:
    name: Deploy to EC2 Web Server
    needs: quality-gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: ./dist

      - name: Configure SSH Key
        env:
          SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
          SSH_KEY_RAW: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$SSH_KEY_B64" ]; then
            echo "Decoding base64-encoded SSH key..."
            printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/id_rsa
          elif [ -n "$SSH_KEY_RAW" ]; then
            echo "Writing raw SSH key..."
            printf '%s\n' "$SSH_KEY_RAW" > ~/.ssh/id_rsa
          else
            echo "::error::Neither EC2_SSH_KEY_B64 nor EC2_SSH_KEY secret is configured!"
            exit 1
          fi

          printf "\n" >> ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Validate key syntax with ssh-keygen before connecting
          ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null || {
            echo "::error::The configured SSH key failed validation! Check your GitHub secret."
            exit 1
          }
          echo "SSH key verified successfully."

      - name: Register Known Hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh-keyscan -H -T 10 "${EC2_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync Build Artifacts via Rsync
        env:
          EC2_USER: ${{ secrets.EC2_USER || 'ec2-user' }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          TARGET_DIR: ${{ secrets.EC2_TARGET_DIR || '/var/www/dashboard' }}
        run: |
          echo "Deploying dashboard to ${EC2_USER}@${EC2_HOST}:${TARGET_DIR}..."
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new" \
            ./dist/ "${EC2_USER}@${EC2_HOST}:${TARGET_DIR}/"

      - name: Reload Nginx Service on EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER || 'ec2-user' }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new "${EC2_USER}@${EC2_HOST}" "sudo systemctl reload nginx || sudo service nginx reload"
          echo "Dashboard successfully deployed and Nginx reloaded!"
