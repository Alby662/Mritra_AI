[project]
name = "mritra"
version = "0.1.0"
description = "Privacy-preserving cross-bank money-mule detection on IBM LinuxONE (IBM Z Datathon 2026)"
readme = "Docs/README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2,<3",
    "pyarrow>=15",
    "pyyaml>=6",
    "pydantic>=2",
    "PyNaCl>=1.5",
    "snapml==1.17.2",
    "networkx>=3.6.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "kaggle>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mritra"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["Docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
